services:
  app:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"