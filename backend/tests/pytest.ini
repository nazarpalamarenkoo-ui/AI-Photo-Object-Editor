[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (with mocked dependencies)
    ml: Tesing machine learn models
    e2e: End-to-end tests (with real services)
    db: Database tests
    storage: Storage tests
    slow: Slow running tests
    gpu: smoke tests that need the real ARQ worker with SAM/LaMa/Diffusion loaded on CUDA
     smoke: fast tests, safe for every PR

addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */venv/*