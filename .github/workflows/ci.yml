name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # BACKEND: lint + type check
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: MyPy type check
        run: mypy app/ --ignore-missing-imports --no-error-summary

  # ──────────────────────────────────────────────
  # BACKEND: unit tests (no DB/Redis needed)
  # ──────────────────────────────────────────────
  backend-unit:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/15"
        run: |
          pytest tests/unit \
            -m "unit and not gpu and not slow" \
            --tb=short \
            --cov=app \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            -q

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: backend/coverage-unit.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # BACKEND: integration + DB tests
  # ──────────────────────────────────────────────
  backend-integration:
    name: Backend — Integration & DB Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: object_detection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Run Alembic migrations (test DB)
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/object_detection_test
        run: alembic upgrade head

      - name: Run integration + DB tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/object_detection_test
          REDIS_URL: redis://localhost:6379/15
          # S3 — use mocked/disabled in test settings
          S3_BUCKET_NAME: test-bucket
          S3_ENDPOINT_URL: ""
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          MLFLOW_TRACKING_URI: ""
        run: |
          pytest tests/integration \
            -m "not gpu and not slow" \
            --tb=short \
            --cov=app \
            --cov-report=xml:coverage-integration.xml \
            -q

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration
          path: backend/coverage-integration.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # BACKEND: smoke tests (no GPU)
  # ──────────────────────────────────────────────
  backend-smoke:
    name: Backend — Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: object_detection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run Alembic migrations (test DB)
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/object_detection_test
        run: alembic upgrade head

      - name: Run smoke tests (no GPU)
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/object_detection_test
          REDIS_URL: redis://localhost:6379/15
          S3_BUCKET_NAME: test-bucket
          S3_ENDPOINT_URL: ""
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          MLFLOW_TRACKING_URI: ""
        run: |
          pytest tests/smoke \
            -m "not gpu" \
            --tb=short \
            -q

  # ──────────────────────────────────────────────
  # FRONTEND
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        # package.json has no "typecheck" script — vue-tsc directly.
        # tsconfig.json is solution-style ("files": [], only "references"
        # to tsconfig.app.json / tsconfig.node.json). `vue-tsc --noEmit`
        # WITHOUT `-b` does not build referenced projects and effectively
        # type-checks nothing, letting broken types through green. The
        # `-b` flag is what the "build" npm script uses under the hood
        # (`vue-tsc -b && vite build`) — match it here.
        run: npx vue-tsc -b --noEmit

      - name: Run unit tests
        # package.json only defines "test": "vitest" — there is no "test:unit".
        run: npm run test -- --run

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ──────────────────────────────────────────────
  # DOCKER BUILD (validation only on PR)
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [backend-smoke, frontend]
    # Build on every push/PR but only push on main (handled in cd.yml)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:ci-${{ github.sha }}

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:ci-${{ github.sha }}

  compose-validate:
    name: Compose — Validate Overlays
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml overlays base cleanly
        run: ./scripts/validate-compose.sh docker-compose.prod.yml

      - name: Validate docker-compose.override.yml overlays base cleanly
        run: ./scripts/validate-compose.sh docker-compose.override.yml

      - name: Validate docker-compose.test.yml parses standalone
        run: ./scripts/validate-compose.sh docker-compose.test.yml

  # ──────────────────────────────────────────────
  # CI gate — required for PR merge
  # ──────────────────────────────────────────────
  ci-success:
    name: CI — All checks passed
    runs-on: ubuntu-latest
    needs: [backend-smoke, frontend, docker-build, compose-validate]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-smoke.result }}" != "success" ]]; then
            echo "backend-smoke failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "frontend failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "docker-build failed"
            exit 1
          fi
          if [[ "${{ needs.compose-validate.result }}" != "success" ]]; then
            echo "compose-validate failed"
            exit 1
          fi
          echo "All CI checks passed ✓"